name: 刷新筛选数据

on:
  schedule:
    # 美东收盘后约 22:00 UTC ≈ 次日 06:00 Asia/Shanghai（夏令时会偏 1 小时）
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行筛选并写入 data/last_scan.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from screener import run_screen

          print("开始筛选…")
          res = run_screen(min_adr=None, top_pct=2.0, require_structure=False)
          out = Path("data/last_scan.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(res, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"完成，入选 {res.get('统计', {}).get('入选')}，写入 {out}")
          PY

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last_scan.json
          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 刷新 last_scan.json ($(date -u +%Y-%m-%d))"
            git push
          fi
